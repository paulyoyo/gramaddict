name: code-checker

on:
  push:
    # only build each push to develop and master, other branches are built through pull requests
    branches: [develop, master]
  pull_request:
  workflow_dispatch:
    inputs:
      run-lint:
        description: 'Run lint job'
        required: false
        default: true
        type: boolean
      run-static-check:
        description: 'Run static-check job'
        required: false
        default: true
        type: boolean

jobs:
  lint:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run-lint == 'true' }}
    steps:
      - name: Clone Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run black
        uses: psf/black@stable

  static-check:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run-static-check == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    steps:
      - name: Clone Repository
        uses: actions/checkout@v3
        
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Pyflakes
        run: |
          pip3 install --upgrade pip
          pip3 install pyflakes

      - name: Detect errors with pyflakes
        run: pyflakes .

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is what the Raspberry Pi runs
        python-version: ['3.9', '3.11']
    steps:
      - name: Clone Repository
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip3 install --upgrade pip
          # uiautomator2 2.16 still imports pkg_resources
          pip3 install -r requirements.txt "setuptools<70" "pytest>=7"

      - name: Run tests
        run: python -m pytest -q
