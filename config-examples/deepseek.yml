# Copy this to accounts/<your_username>/deepseek.yml
# Drives the DJ DM flow: the greeting (step 1) and the AI-classified reply
# conversation (step 2+). DeepSeek is used ONLY to classify the user's reply as
# YES/NO/UNSURE — all message text and links below are inserted by the bot, so
# the links can never be mangled by the AI.

deepseek-api-key: "sk-your-deepseek-api-key"
model: "deepseek-chat"

# Your links (inserted verbatim by the bot).
youtube-link: "https://youtu.be/your-mix"
soundcloud-link: "https://soundcloud.com/you/your-mix"

# All user-facing text is Spanish (Peru) — tú form (sigues/quieres/usas), no voseo.
# --- Step 1: greeting templates (dj-greeting-mode) ---
# {name} = the person's first name (from their profile). Keep several variants
# so the greeting isn't identical every time (helps avoid spam detection).
greetings:
  - "¡Hola {name}! 👋"
  - "¡Qué tal, {name}! 🙌"
  - "¡Hey {name}!"
# Added when the user was found via a followers/following OR post-likers source
# (i.e. blogger-followers / blogger-following / blogger-post-likers). NOT added for
# the plain "blogger" job (which is skipped entirely). {source} = the blogger account.
source-context: "Vi que sigues a {source} 🎶"
# The ask, appended to every greeting.
mix-question: "Acabo de sacar un nuevo mix, ¿quieres escucharlo?"

# --- Step 2+: reply templates. {link} is replaced with the links above. ---
# Sent when the user shows interest in the mix.
youtube-messages:
  - "¡Genial! Aquí está: {link} 🔥 ¿También usas SoundCloud?"
  - "¡Buenísimo! Escúchalo aquí: {link} 🎧 ¿Estás en SoundCloud también?"
# Sent when the user says they use SoundCloud.
soundcloud-messages:
  - "Aquí está la versión de SoundCloud: {link} 🎧"
  - "Listo, te paso el SoundCloud: {link} 🙏"
