# Copy this to accounts/<your_username>/deepseek.yml
# Drives the DJ DM flow: the greeting (step 1) and the AI-classified reply
# conversation (step 2+). DeepSeek is used ONLY to classify the user's reply as
# YES/NO/UNSURE — all message text and links below are inserted by the bot, so
# the links can never be mangled by the AI.

deepseek-api-key: "sk-your-deepseek-api-key"
model: "deepseek-chat"

# Your links (inserted verbatim by the bot).
youtube-link: "https://youtu.be/your-mix"
soundcloud-link: "https://soundcloud.com/you/your-mix"

# All user-facing text is Spanish (Peru) — tú form (sigues/quieres/usas), no voseo.
# --- Step 1: greeting templates (dj-greeting-mode) ---
# {name} = the person's first name (from their profile). One is picked at random.
greetings:
  - "Hola {name}!"
  - "Qué tal, {name}! 🙌"
  - "Holi {name}!"
  - "Hey {name}! 👋"
  - "Buenas {name}!"
  - "Qué onda {name}!"
  - "Hola hola {name} 🙌"
  - "{name}! Qué tal?"
# Added when the user was found via a followers/following OR post-likers source.
# {source} = the account they follow. One string, or a list to pick from.
source-context:
  - "Vi que sigues a {source} 🎶"
  - "Vi que también sigues a {source} 🔥"
  - "Te vi por {source} 🎧"
  - "Te encontré por {source} 🎶"
# The ask, appended to every greeting. One string, or a list to pick from.
mix-question:
  - "Acabo de sacar un nuevo mix, quieres escucharlo?"
  - "Saqué un mix nuevo, te lo paso?"
  - "Tengo un mix nuevito, te animas a escucharlo?"
  - "Acabo de subir un set nuevo, quieres que te lo pase?"
  - "Estrené mix hace poco, te gustaría escucharlo?"
  - "Justo terminé un mix nuevo, quieres oírlo?"

# --- Step 2+: reply templates. {link} is replaced with the links above. ---
# Sent when the user shows interest in the mix (must end asking about SoundCloud).
youtube-messages:
  - "Genial! Aquí está: {link} 🔥 También usas SoundCloud?"
  - "Buenazo! Escúchalo aquí: {link} 🎧 Estás en SoundCloud también?"
  - "Dale! Te lo dejo aquí: {link} 🙌 Por cierto, usas SoundCloud?"
  - "Chévere! Aquí va: {link} 🔥 Tienes SoundCloud?"
  - "Listo! {link} 🎶 También lo tengo en SoundCloud, lo usas?"
  - "Aquí tienes: {link} 🎧 Cuéntame qué tal! Usas SoundCloud también?"
# Sent when the user says they use SoundCloud.
soundcloud-messages:
  - "Aquí está la versión de SoundCloud: {link} 🎧"
  - "Listo, te paso el SoundCloud: {link} 🙏"
  - "Ahí va el de SoundCloud: {link} 🔥"
  - "Te lo dejo en SoundCloud: {link} 🎶 Gracias por escuchar!"
  - "Por aquí en SoundCloud: {link} 🙌 Cualquier cosa me dices!"
